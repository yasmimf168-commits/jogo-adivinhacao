<!DOCTYPE html>
<html lang="pt-br" >
  <head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Jogo de Advinhação</title>

    <style>
      .CorpoDaPagina{
        font-family: Verdana, Geneva, Tahoma, sans-serif;
        background-color: rgb(165, 223, 132);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;

      }    
      h1{
        color: cornsilk;
      }
      .container{
          text-align: center;
          background-color: rgb(149, 227, 247);
          padding: 20px;
          border-radius: 10px;
          box-shadow: 0px 0px 10px rebeccapurple
      }

      input[type="number"]{
        padding: 10px;
        font-size: 16px;
        width: 50px;
        margin-bottom: 10px;
    }

    button{padding: 10px 20px;
    font-size: 16px;
    cursor: pointer;
    background-color: antiquewhite;
    color: rgb(0, 0, 0);
    border: none;
    border-radius: 5px;
}

    </style>
  

  </head>


    <body class="CorpoDaPagina">

          <div class="container">

                <h1>&#128523; Jogo de Adivinhaçao &#128523;</h1>
                <p>Tente adivinhar o numero sercreto entre 1 e 100 &#9757;&#65039;&#129299;</p>
            
                <input type="number"id="TXTPalpite" min="1" max="100"/>
                <button id="BTNadivinhar" onclick="VerifcarPalpite()" >Adivinhar</button>
                <div class="mensagem" id="DIVMensagem"></div>

          </div>
        
    </body>
        
    <script>
      let numeroSecreto = 25;
      

        function VerifcarPalpite(){
            //-------------------------
        // 1º Verificas se o jogador digitou
        //    algum número na caixa de texto
        //-------------------------
      let caixaDeTexto = document.getElementById('TXTPalpite');
      let dvMensagem = document.getElementById('DIVMensagem');

      let chuteDoJogador = parseInt(caixaDeTexto.value);
      

      //Validação do número digitado. O campo não pode ser vazio e o número deve estar entre 1 e 100//
      if( isNaN(chuteDoJogador)|| chuteDoJogador < 1 || chuteDoJogador > 100){
        dvMensagem.textContent = 'PorFavor, insira um número válido entre 1 a 100';
      }else{
        dvMensagem.textContent = 'numero valido: '+chuteDoJogador;
            console.log('Passei por aqui' );
      }

      if(chuteDoJogador === numeroSecreto){
        dvMensagem.textContent = 'Parabéns! você acertou o numero secreto '+numeroSecreto;
      }else{
        dvMensagem.textContent = 'Errou';

      }


      }


    </script>


  </html>
